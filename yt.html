<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>PLEX:arctic trailer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="p"></div>
<script>
/* Trailer page for PLEX:arctic. The TV app shows this page in a frame; because this page has a normal
   web address, YouTube agrees to play here. The app sends simple commands (play/pause, skip). */
var q = new URLSearchParams(location.search);
var id = q.get('v') || '';
var cc = q.get('cc') || '';   /* subtitle language wanted, e.g. sv */
var hl = q.get('hl') || cc;
/* probe=1: only find out how long the video is (the app uses it to come back after the YouTube app), silently */
var probe = q.get('probe') === '1';
var player = null;
function send(msg) { try { parent.postMessage(msg, '*'); } catch (e) {} }
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
function onYouTubeIframeAPIReady() {
  player = new YT.Player('p', {
    videoId: id,
    playerVars: { autoplay: probe ? 0 : 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, origin: location.origin,
      cc_load_policy: cc ? 1 : 0, cc_lang_pref: cc || undefined, hl: hl || undefined },
    events: {
      onReady: function (e) { if (probe) { startProbe(e.target); return; } e.target.playVideo(); send({ yt: 'ready', v: 2 }); if (cc) send({ yt: 'cc', mode: 'looking' }); },
      onApiChange: function () { pickCaptions(); },
      onStateChange: function (e) { send({ yt: 'state', s: e.data }); },
      onError: function (e) { send({ yt: 'error', code: e.data }); }
    }
  });
}
/* the length, without playing if YouTube already knows it; otherwise a moment of silent play */
function startProbe(p) {
  p.mute();
  var n = 0, played = false;
  var iv = setInterval(function () {
    n++;
    var d = 0; try { d = p.getDuration() || 0; } catch (err) {}
    if (d > 0 && (!played || n > 4)) { clearInterval(iv); try { p.stopVideo(); } catch (err) {} send({ yt: 'dur', d: d }); return; }
    if (n === 10 && !played) { played = true; p.playVideo(); }
    if (n > 40) { clearInterval(iv); try { p.stopVideo(); } catch (err) {} send({ yt: 'dur', d: 0 }); }
  }, 250);
}
/* subtitles: the wanted language if the video has it, otherwise YouTube's own translation of the English (or the
   first) track. The caption list can arrive late, so this is tried again for a while; the result is sent to the app. */
var ccDone = false, ccTries = 0;
function pickCaptions() {
  if (!cc || ccDone || !player || !player.getOption) return;
  try {
    if (player.loadModule) player.loadModule('captions');
    var list = player.getOption('captions', 'tracklist') || [];
    if (!list.length) return;
    var own = list.filter(function (x) { return x.languageCode === cc || String(x.languageCode).indexOf(cc + '-') === 0; });
    var real = own.filter(function (x) { return x.kind !== 'asr'; })[0] || own[0];
    if (real) { player.setOption('captions', 'track', real); ccDone = true; send({ yt: 'cc', mode: 'own', lang: real.languageCode }); return; }
    var en = list.filter(function (x) { return /^en/.test(x.languageCode) && x.kind !== 'asr'; })[0] || list.filter(function (x) { return x.kind !== 'asr'; })[0] || list[0];
    player.setOption('captions', 'track', { languageCode: en.languageCode, translationLanguage: { languageCode: cc } });
    ccDone = true;
    send({ yt: 'cc', mode: 'translated', from: en.languageCode });
  } catch (err) {}
}
setInterval(function () {
  if (ccDone || !cc || !player || !player.getPlayerState || player.getPlayerState() !== 1) return;
  ccTries++;
  pickCaptions();
  if (!ccDone && ccTries === 12) send({ yt: 'cc', mode: 'none' });
}, 1000);
window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (!player || !d.cmd) return;
  if (d.cmd === 'toggle') { if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo(); }
  if (d.cmd === 'seek') player.seekTo(Math.max(0, player.getCurrentTime() + d.by), true);
});
setInterval(function () {
  if (probe) return;
  if (player && player.getCurrentTime) send({ yt: 'time', t: player.getCurrentTime(), d: player.getDuration() });
}, 1000);
</script>
</body>
</html>
